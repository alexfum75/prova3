format:
  html:
    mainfont: "Baskerville, sans-serif"
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnfonts.com">
    theme: 
      - cosmos
      - custom.scss
    js: scripts.js
    css: css/styles.css
    toc: true
    html-math-method: katex
    smooth-scroll: true
    anchor-sections: true
    #include-in-header: analytics.html
    page-layout: full
    filters:
      - abstract-section

execution:
  engine: jupyter
  freeze: auto  # Recommended: prevents re-running code on every site build unless modified      