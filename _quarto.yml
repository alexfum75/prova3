project:
  type: website
  output-dir: docs
  pre-render: python/replace_strings.py  
  preview:
    port: 7777

website:
    title: "Articoli di astronomia"
    favicon: images/logo.jpeg
    site-url: https://alexfum75.github.io/bb
    navbar: 
        background: white
        pinned: false
        right:
          - href: LunaMarte.qmd
            text: Perché la Luna
          - href: tt4.qmd
            text: Home
          - href: friends/friends.qmd
            text: Link
          - href: videos/index.qmd
            text: Registrazioni
          - href: eventi.qmd
            text: Conferenze
          - href: blog.qmd
            text: Blog
          - icon: linkedin
            href: https://www.linkedin.com/in/alessandrofumagalli/
    sidebar:
      - id: dsanotes
        style: docked
        sort: order
        title: "Special Tools"
        contents:
          - section: "Titolo sezione"        
            contents: "materials/dsanotes/*.qmd" 
      - id: algonotes
        style: docked
        sort: order
        title: "Special Tools"
        contents:
          - section: "DSA Notes"        
            contents: "materials/algorithms/*.qmd" 
      - id: cpnotes
        style: docked
        sort: order
        title: "Special Tools"
        contents:
          - section: "DSA Notes"        
            contents: "materials/cpnotes/*.qmd" 
      - id: games
        style: docked
        sort: order
        title: "Special Tools"
        contents:
          - section: "DSA Notes"        
            contents: "materials/games/*.qmd" 

format:
  html:
    fontsize: 17px  # You can use em, px, rem, or pt (e.g., 18px, 12pt)  
    mainfont: "Armarialbold, sans-serif;"
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnfonts.com">
    theme: 
      - cosmos
      - custom.scss
    js: scripts.js
    css: css/styles.css
    toc: true
    html-math-method: katex
    smooth-scroll: true
    anchor-sections: true
    #include-in-header: analytics.html
    page-layout: full
    filters:
      - abstract-section

execution:
  engine: jupyter
  freeze: auto  # Recommended: prevents re-running code on every site build unless modified      